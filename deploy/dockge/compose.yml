services:
  flowerchat-server:
    image: ghcr.io/toribash67/flowerchat-server:latest
    container_name: flowerchat-server
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      FLOWERCHAT_LISTEN: 0.0.0.0:80
      # What clients are told to use for finding a way to each other. Left
      # unset, that is a public STUN server, which is enough for most home
      # connections. A TURN relay, once there is one, goes here too:
      # FLOWERCHAT_ICE_SERVERS: '[{"urls":["stun:stun.l.google.com:19302"]},{"urls":["turn:turn.example.org:3478"],"username":"u","credential":"p"}]'
      # The rooms that are always in the list, in this order. Others exist
      # while someone is in them.
      # FLOWERCHAT_ROOMS: lounge,games
      # Only invited people may join: see "Invites" in the README here. The
      # file lives in the folder mounted below, so that it outlasts updates.
      # FLOWERCHAT_INVITES: /data/invites.json
    # volumes:
    #   - ./data:/data
    ports:
      - "18084:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
