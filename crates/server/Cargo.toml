[package]
name = "flowerchat-server"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
flowerchat-protocol = { version = "0.2.1", path = "../protocol" }
futures-util = "0.3.34"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
