[package]
name = "flowerchat-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
flowerchat-protocol = { version = "0.1.0", path = "../protocol" }
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
