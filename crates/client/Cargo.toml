[package]
name = "flowerchat-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
flowerchat-protocol = { version = "0.1.0", path = "../protocol" }
futures-util = "0.3.34"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-sdp = "0.25.3"
gstreamer-video = "0.25"
gstreamer-webrtc = { version = "0.25.4", features = ["v1_22"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[dev-dependencies]
axum = "0.8.9"
flowerchat-server = { path = "../server" }

[[bin]]
name = "flowerchat-cli"
path = "src/main.rs"
