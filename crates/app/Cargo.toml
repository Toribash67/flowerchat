[package]
name = "flowerchat-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui-phosphor = "0.14.0"
egui_extras = "0.36"
flowerchat-client = { version = "0.1.0", path = "../client" }
flowerchat-protocol = { version = "0.1.0", path = "../protocol" }
gstreamer = "0.25.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[[bin]]
name = "flowerchat"
path = "src/main.rs"
